name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Every check below runs even if an earlier one fails, so one PR shows all its problems.
      - id: install
        run: bun install --frozen-lockfile

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      # Romanian uses ș ț with a comma below; ş ţ (cedilla) are a different, wrong letter that
      # keyboards and AI tools often produce.
      - name: Romanian diacritics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: "! LC_ALL=C.UTF-8 grep -n '[şţŞŢ]' src/i18n/ro.json"

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      # `bun run api:types` writes src/api/schema.d.ts from the contract on the API's main, which
      # moves on its own, so this can't diff against the committed file. It checks the generator still
      # runs: TypeScript 7 removed the compiler API openapi-typescript uses (#19).
      - name: API types generator runs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx openapi-typescript https://raw.githubusercontent.com/CampusPulse-ro/api/main/openapi/v1.json -o "$RUNNER_TEMP/schema.d.ts"

      # Dependency versions vs the SDK, config validity, duplicate native modules.
      - name: Expo Doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo-doctor@latest

      # Bundles the JS for both platforms exactly as a build would — catches a bad
      # import or a missing asset that tsc can't see — without a native build.
      - name: Bundle (iOS + Android)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx expo export --platform ios --platform android --output-dir dist
